[project]
name = "desk"
version = "0.1.0"
description = "Multi-agent trading desk: Solana memecoin screener + SMC price-action engine. Phase 0: paper trading."
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
ai = ["anthropic>=0.70"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
